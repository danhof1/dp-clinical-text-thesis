# config/evaluator_rmu_cluster.yaml
# Evaluator config for RMU unlearning (MTSamples or PMC target).
# Run standalone:
#   python -m eval.evaluator --config config/evaluator_rmu_cluster.yaml \
#       --checkpoint outputs/unlearn_rmu/step_final

base_model: "/fs1/shared/model/llm/Llama-3.1-8B-Instruct"

splits_path: "/fs1/projects/unlearning_pretraining/Proj_code/Scripts_3.0/New Experiment/Unlearning/mtsamples_unlearn_dp/mtsamples_unlearn_dp/outputs/splits_v1"

checkpoint_path: "/fs1/projects/unlearning_pretraining/Proj_code/Scripts_3.0/New Experiment/Unlearning/mtsamples_unlearn_dp/mtsamples_unlearn_dp/outputs/unlearn_rmu/step_final"

output_dir: "/fs1/projects/unlearning_pretraining/Proj_code/Scripts_3.0/New Experiment/Unlearning/mtsamples_unlearn_dp/mtsamples_unlearn_dp/outputs/eval/unlearn_rmu"

# Shadow root — set once shadow models are trained for MTSamples
# Leave empty to skip LiRA gracefully
shadow_root: ""

# Metric toggles — set false to skip
metrics:
  ppl_on_splits:  true
  ks_test:        true
  relearn_attack: true
  mmlu_medical:   true
  lira:           false     # flip to true once shadow_root is set

# KS test
ks_n_samples: 300

# Re-learn attack
relearn_steps:       50
relearn_forget_frac: 0.05
relearn_lr:          5.0e-5

# MMLU
mmlu_subsets:
  - clinical_knowledge
  - professional_medicine
  - anatomy
mmlu_max_samples: 200

# LiRA (unused until shadow_root is set)
lira_mode: "offline"
ulira: false

# Shared
max_seq_length: 512
bf16: true
